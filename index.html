<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1de">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEM DJ">
<title>CEM DJ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('cem.theme') || 'light'; } catch (e) {}
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<header class="top">
  <img src="logo.jpg" alt="">
  <div class="brand">CENTRO EVANGÉLICO MUNDIAL - SALTO</div>
  <button class="ibtn" id="setBtn" aria-label="Ajustes"></button>
  <button class="ibtn" id="addBtn" aria-label="Agregar canciones"></button>
</header>

<main class="console">
  <!-- Onda: adelante el deck que suena, atrás (tenue) el otro -->
  <section class="panel waves" aria-label="Onda de los decks">
    <canvas id="waveCv"></canvas>
    <span class="lane-tag" id="tagFront">A</span>
    <span class="lane-tag back" id="tagBack">B</span>
  </section>

  <section class="panel deck" id="deckA" aria-label="Deck A"></section>
  <section class="panel deck" id="deckB" aria-label="Deck B"></section>

  <!-- Mezclador -->
  <section class="panel mixer" aria-label="Mezclador">
    <div class="strip" data-d="0">
        <label class="sl"><small>Agudos</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="0" data-band="high" aria-label="Agudos deck A"></label>
        <label class="sl"><small>Medios</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="0" data-band="mid" aria-label="Medios deck A"></label>
        <label class="sl"><small>Graves</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="0" data-band="low" aria-label="Graves deck A"></label>
        <label class="sl"><small>Volumen</small><input type="range" min="0" max="100" value="100" data-d="0" data-vol aria-label="Volumen deck A"></label>
        <div class="vu" id="vu0"><i></i></div>
        <button class="pill sm voz" data-d="0">Sin voz</button>
    </div>

    <div class="center">
      <button class="pill on" id="mixBtn">Mezclar A → B</button>
      <label class="auto"><span>Automix</span><input type="checkbox" class="sw" id="autoChk"></label>
      <select id="mixSecs" aria-label="Duración de la mezcla">
        <option value="4">Mezcla 4 s</option><option value="8">Mezcla 8 s</option><option value="12">Mezcla 12 s</option><option value="16">Mezcla 16 s</option>
      </select>
      <label class="sl col"><small>General</small><input type="range" id="masterR" min="0" max="100" value="90" aria-label="Volumen general"></label>
    </div>

    <div class="strip rev" data-d="1">
        <label class="sl"><small>Agudos</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="1" data-band="high" aria-label="Agudos deck B"></label>
        <label class="sl"><small>Medios</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="1" data-band="mid" aria-label="Medios deck B"></label>
        <label class="sl"><small>Graves</small><input type="range" class="bip" min="-12" max="12" step="0.5" value="0" data-d="1" data-band="low" aria-label="Graves deck B"></label>
        <label class="sl"><small>Volumen</small><input type="range" min="0" max="100" value="100" data-d="1" data-vol aria-label="Volumen deck B"></label>
        <div class="vu" id="vu1"><i></i></div>
        <button class="pill sm voz" data-d="1">Sin voz</button>
    </div>

    <div class="xfrow">
      <b>A</b>
      <input type="range" id="xfade" min="0" max="1000" value="0" aria-label="Crossfader">
      <b>B</b>
    </div>
  </section>

  <!-- Biblioteca y listas -->
  <section class="panel lib" aria-label="Biblioteca">
    <div class="lib-head"><h2 id="libTitle">Biblioteca</h2><button class="pill" id="addBtn2"></button></div>
    <div class="chips" id="chips"></div>
    <input type="search" class="search" id="search" placeholder="Buscar canción o artista" autocomplete="off">
    <div id="rows"></div>
    <div class="note" id="libNote"></div>
  </section>
</main>

<dialog id="settings">
  <h3>Ajustes</h3>
  <div class="group">
    <label class="set"><div class="tx"><b>Nivelar volumen</b><small>Iguala el volumen entre canciones.</small></div><input type="checkbox" id="levelChk" class="sw"></label>
    <label class="set"><div class="tx"><b>Automix</b><small>Al terminar una canción, entra la siguiente de la lista en el otro deck.</small></div><input type="checkbox" id="autoChk2" class="sw"></label>
    <label class="set"><div class="tx"><b>Modo oscuro</b></div><input type="checkbox" id="darkChk" class="sw"></label>
    <button class="set" id="installBtn" hidden><div class="tx"><b>Instalar en la pantalla de inicio</b></div></button>
  </div>
  <div class="note" id="storeNote"></div>
  <div class="col"><button class="pill on" id="setClose">Listo</button></div>
</dialog>

<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple hidden>
<dialog id="sheet"><h3 id="sheetTitle"></h3><p id="sheetText" hidden></p><input type="text" id="sheetInput" hidden><div class="col" id="sheetBtns"></div></dialog>
<div class="toast" id="toast"></div>

<script src="bpm.js"></script>
<script src="lufs.js"></script>
<script src="app.js"></script>
</body>
</html>
